gin-top:5px}.up{color:var(--green)!important}.down{color:var(--red)!important}.chart-card{border:1px solid var(--line);border-radius:3.5mm;padding:3.2mm 3.5mm 2.5mm;margin:0 2mm}.chart-title{font-weight:700;font-size:10px;margin-bottom:2mm}.chart{height:42mm;width:100%;display:block}.quote{background:var(--pale);border:1px solid #cfe7f1;margin:5mm 0 0;padding:6.5mm 5mm;text-align:center;font-family:'Syne',Arial,sans-serif;font-size:14px;font-weight:700}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:5mm}.mini-stat{border:1px solid var(--line);padding:3mm}.mini-stat .label{color:var(--blue)}.mini-stat .big{font-family:'Syne',Arial,sans-serif;font-size:23px;font-weight:800;margin-top:2px}.asset-section{margin-top:5mm}.asset-section:first-of-type{margin-top:4mm}.icon-title{display:flex;align-items:center;gap:2.5mm}.asset-icon{width:9mm;height:9mm;flex:0 0 9mm;object-fit:contain;object-position:center}.vector-icon{width:8mm;height:8mm;flex:0 0 8mm;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.stock-icon{stroke:#16a9df}.crypto-icon{stroke:#159b70}.mf-icon{stroke:#6d75c9}.utility-icon{stroke:#d09b25}.asset-section .section-title{font-size:24px}.asset-section .section-sub{margin-top:1px}.signature{margin-top:10mm;margin-left:auto;margin-right:0;width:70mm;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start}.signature img{display:block;margin-left:auto;margin-right:0;align-self:flex-end}.signature .sig-name,.signature .sig-role{align-self:flex-end;text-align:right}

<body>
<div id="app" class="report"></div>
<script>
(function(){
'use strict';
const API_BASE=(window.REPORT_CONFIG&&window.REPORT_CONFIG.apiBase)||'https://refer-earn-app.onrender.com';
const ASSET=(window.REPORT_CONFIG&&window.REPORT_CONFIG.assetBase)||'';
const qs=new URLSearchParams(location.search);
let currentData=null;
function assetPath(name){return (ASSET||'')+'/icons/'+name}
function img(name,cls,alt){return '<img class="'+(cls||'')+'" src="'+assetPath(name)+'" alt="'+(alt||'')+'" onerror="this.onerror=null;this.src=\'/'+name+'\';">'}
function assetIcon(type){const t=String(type||'').toLowerCase();const file=t==='stocks'?'stock.png':t==='crypto'?'crypto.png':t==='mutualfunds'?'mf.png':'utility.png';return '<img class="asset-icon" src="'+assetPath(file)+'" alt="" onerror="this.onerror=null;this.style.display=\'none\'">'}
function money(v){if(v==null||Number.isNaN(Number(v)))return '—';return '₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:0})}
function money2(v){if(v==null||Number.isNaN(Number(v)))return '—';return '₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:2,minimumFractionDigits:2})}
function qty(v){if(v==null||Number.isNaN(Number(v)))return '—';return Number(v).toLocaleString('en-IN',{maximumFractionDigits:6})}
function pct(v){if(v==null||Number.isNaN(Number(v)))return '—';return (v>=0?'+':'')+Number(v).toFixed(2)+'%'}
function gainText(g){if(!g||g.abs==null)return '—';return (g.abs>=0?'+':'-')+money(Math.abs(g.abs))+(g.pct!=null?' ('+pct(g.pct)+')':'')}
function endDate(month){const [y,m]=String(month).split('-').map(Number);if(!y||!m)return new Date();return new Date(y,m,0)}
function monthLabel(month){const d=endDate(month);return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function dateLabel(d){if(!d)return '—';return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}
function shortDate(d){if(!d)return '—';return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function signClass(v){return Number(v)>=0?'up':'down'}
function getCookie(n){const f=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(n+'='));return f?decodeURIComponent(f.slice(n.length+1)):null}
function local(k){try{return localStorage.getItem(k)}catch(e){return null}}
async function getJSON(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok||d.success===false)throw new Error(d.msg||'Request failed');return d}
async function fetchData(email){
 const headers={'x-user-email':email};
 const [h,g]=await Promise.all([
  getJSON(API_BASE+'/api/portfolio/holdings',{headers}),
  getJSON(API_BASE+'/api/portfolio/gains',{headers})
 ]);
 const p=h.portfolio||{stocks:[],crypto:[],mutualfunds:[],utility:[]};
 const gains=g||{stocks:[],crypto:[],mutualfunds:[],utility:[],totals:{}};
 const live={};
 const tasks=[];
 p.stocks.forEach(x=>tasks.push(getJSON(API_BASE+'/api/portfolio/proxy/stock?sym='+encodeURIComponent(x.symbol)).then(d=>live[x.symbol]=d.price).catch(()=>{})));
 p.crypto.forEach(x=>tasks.push(getJSON(API_BASE+'/api/portfolio/proxy/crypto?id='+encodeURIComponent(x.coinId)+'&symbol='+encodeURIComponent(x.symbol||'')).then(d=>live[x.coinId]=d.price).catch(()=>{})));
 p.utility.forEach(x=>tasks.push(getJSON(API_BASE+'/api/portfolio/proxy/metal?type='+encodeURIComponent(x.assetId||'gold')).then(d=>live[x.assetId||'gold']=d.price).catch(()=>{})));
 p.mutualfunds.forEach(x=>tasks.push(getJSON(API_BASE+'/api/portfolio/proxy/mf-price?code='+encodeURIComponent(x.schemeCode)).then(d=>live[x.schemeCode]=d.price).catch(()=>{})));
 await Promise.allSettled(tasks);
 return {portfolio:p,gains,live};
}
function gainMap(gains,bucket){const m={};(gains[bucket]||[]).forEach(x=>m[String(x.id)]=x);return m}
function mfInvested(h){if(h.method==='onetime')return Number(h.units||0)*Number(h.buyPrice||0);const start=new Date(h.sipStartDate);if(!Number.isFinite(start.getTime()))return 0;const amount=Number(h.sipAmount||0);const day=Math.min(Math.max(Number(h.sipDay)||1,1),28);let c=new Date(start.getFullYear(),start.getMonth(),day);if(c<start)c=new Date(start.getFullYear(),start.getMonth()+1,day);let n=0,now=new Date();while(c<=now){n++;c=new Date(c.getFullYear(),c.getMonth()+1,day)}return n*amount}
function mfUnits(h,gm){const g=gm[String(h._id)];if(g&&g.totalUnits!=null)return Number(g.totalUnits);return h.method==='onetime'?Number(h.units||0):0}
function categoryCalc(cat,p,gains,live){const list=p[cat]||[],gm=gainMap(gains,cat);let invested=0,value=0;
 list.forEach(h=>{if(cat==='stocks'){invested+=Number(h.quantity||0)*Number(h.buyPrice||0);value+=Number(live[h.symbol]||h.buyPrice||0)*Number(h.quantity||0)}
 else if(cat==='crypto'){invested+=Number(h.quantity||0)*Number(h.buyPrice||0);value+=Number(live[h.coinId]||h.buyPrice||0)*Number(h.quantity||0)*Number(h.leverage||1)}
 else if(cat==='utility'){invested+=Number(h.quantity||0)*Number(h.buyPrice||0);value+=Number(live[h.assetId||'gold']||h.buyPrice||0)*Number(h.quantity||0)}
 else {const u=mfUnits(h,gm);invested+=mfInvested(h);value+=Number(live[h.schemeCode]||gm[String(h._id)]?.currentPrice||h.buyPrice||0)*u}});
 return {invested,value,pnl:value-invested,month:gains.totals&&gains.totals[cat]&&gains.totals[cat].month,gm};}
function totalCalc(p,gains,live){const cats=['stocks','crypto','mutualfunds','utility'].map(c=>categoryCalc(c,p,gains,live));return cats.reduce((a,x)=>({invested:a.invested+x.invested,value:a.value+x.value,pnl:a.pnl+x.pnl}),{invested:0,value:0,pnl:0})}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function svgChart(points,opts){
 const w=1000,h=250,pad={l:7,r:7,t:16,b:26};let pts=(points||[]).filter(x=>x&&Number.isFinite(Number(x.y))).sort((a,b)=>a.x-b.x);if(pts.length<2)return '<svg class="chart" viewBox="0 0 1000 250"><text x="500" y="125" text-anchor="middle" fill="#73879b" font-size="24">No historical chart data</text></svg>';
 const ys=pts.map(x=>Number(x.y)), min=Math.min(...ys),max=Math.max(...ys),span=max-min||1;const xy=pts.map((p,i)=>({x:pad.l+(i/(pts.length-1))*(w-pad.l-pad.r),y:pad.t+(1-(Number(p.y)-min)/span)*(h-pad.t-pad.b)}));
 const line=xy.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');const area=line+' L '+xy[xy.length-1].x+' '+(h-pad.b)+' L '+xy[0].x+' '+(h-pad.b)+' Z';
 const color=opts&&opts.color||'#16a9df';const gid='g'+Math.random().toString(36).slice(2);const grid=[.2,.45,.7].map(f=>'<line x1="'+pad.l+'" y1="'+(pad.t+f*(h-pad.t-pad.b))+'" x2="'+(w-pad.r)+'" y2="'+(pad.t+f*(h-pad.t-pad.b))+'" stroke="#e8f0f4" stroke-width="1"/>').join('');
 const labels=opts&&opts.labels?opts.labels:[];const lab=labels.map((l,i)=>'<text x="'+(pad.l+(i/(Math.max(1,labels.length-1)))*(w-pad.l-pad.r))+'" y="'+(h-5)+'" text-anchor="middle" fill="#73879b" font-size="12">'+esc(l)+'</text>').join('');
 return '<svg class="chart" viewBox="0 0 1000 250" preserveAspectRatio="none"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".18"/><stop offset="1" stop-color="'+color+'" stop-opacity=".02"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#'+gid+')" opacity=".9"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+'<circle cx="'+xy[xy.length-1].x+'" cy="'+xy[xy.length-1].y+'" r="5" fill="'+color+'"/>'+lab+'</svg>'
}
async function buildTrend(p,live,range,gainsOverride){
 const lists=[];const add=(cat,h,qty)=>lists.push({cat,h,qty});
 (p.stocks||[]).forEach(h=>add('stocks',h,Number(h.quantity||0)));
 (p.crypto||[]).forEach(h=>add('crypto',h,Number(h.quantity||0)*Number(h.leverage||1)));
 (p.utility||[]).forEach(h=>add('utility',h,Number(h.quantity||0)));
 const gm=gainMap(gainsOverride||currentData?.gains||{},'mutualfunds');(p.mutualfunds||[]).forEach(h=>add('mutualfunds',h,mfUnits(h,gm)));
 if(!lists.length)return [];
 function pointX(pt){let x=pt&&(pt.x??pt.timestamp??pt.time??pt.date);if(x instanceof Date)x=x.getTime();if(typeof x==='string'){const n=Number(x);x=Number.isFinite(n)?n:Date.parse(x)}else x=Number(x);if(Number.isFinite(x)&&x>0&&x<100000000000)x*=1000;return Number.isFinite(x)?x:null}
 function pointY(pt){const y=Number(pt&&(pt.y??pt.price??pt.nav??pt.value));return Number.isFinite(y)?y:null}
 const results=await Promise.allSettled(lists.map(async item=>{
   let data=[];
   if(item.cat==='stocks')data=(await getJSON(API_BASE+'/api/portfolio/proxy/stock-chart?sym='+encodeURIComponent(item.h.symbol)+'&range='+encodeURIComponent(range))).data||[];
   else if(item.cat==='crypto')data=(await getJSON(API_BASE+'/api/portfolio/proxy/crypto-chart?id='+encodeURIComponent(item.h.coinId)+'&range='+encodeURIComponent(range)+'&symbol='+encodeURIComponent(item.h.symbol||''))).data||[];
   else if(item.cat==='utility')data=(await getJSON(API_BASE+'/api/portfolio/proxy/metal-chart?type='+encodeURIComponent(item.h.assetId||'gold')+'&range='+encodeURIComponent(range))).data||[];
   else data=(await getJSON(API_BASE+'/api/portfolio/proxy/mf-chart?code='+encodeURIComponent(item.h.schemeCode)+'&range='+encodeURIComponent(range))).data||[];
   return data.map(pt=>{const x=pointX(pt),y=pointY(pt);return x!=null&&y!=null?{x,y:y*item.qty}:null}).filter(Boolean).sort((a,b)=>a.x-b.x);
 }));
 const series=results.filter(r=>r.status==='fulfilled'&&r.value.length>=2).map(r=>r.value);
 if(!series.length)return [];
 let base=series.reduce((a,s)=>s.length>a.length?s:a,series[0]);
 function at(s,t){let v=s[0].y;for(const p of s){if(p.x<=t)v=p.y;else break}return v}
 const out=base.map(pt=>({x:pt.x,y:Number(series.reduce((sum,s)=>sum+at(s,pt.x),0).toFixed(2))}));
 return out;
}
function labelsFor(points){if(!points.length)return [];const n=7;return Array.from({length:n},(_,i)=>{const idx=Math.min(points.length-1,Math.round(i*(points.length-1)/(n-1)));return new Date(points[idx].x).toLocaleDateString('en-IN',{day:'2-digit',month:i===0||i===n-1?'short':undefined})})}
function holdingsTable(cat,list,gm,live){if(!list.length)return '<div class="empty">No holdings in this category.</div>';
 if(cat==='stocks')return '<table class="table"><thead><tr><th>Stock</th><th>Total Value</th><th>Per Share</th><th>Shares</th><th>Returns</th></tr></thead><tbody>'+list.map(h=>{const g=gm[String(h._id)]?.gains;const v=Number(live[h.symbol]||h.buyPrice||0)*Number(h.quantity||0);return '<tr><td><b>'+esc(h.name)+'</b></td><td>'+money(v)+'</td><td>'+money2(live[h.symbol]||h.buyPrice)+'</td><td>'+qty(h.quantity)+'</td><td class="return '+signClass(g?.overall?.abs)+'">'+gainText(g?.overall)+'</td></tr>'}).join('')+'</tbody></table>';

 const page3='<section class="report-page">'+pageHeader(month)+'<div class="content"><div class="section-number">02 • Equities</div><div class="icon-title">'+assetIcon('stocks')+'<div><h2 class="section-title">Stocks</h2><div class="section-sub">Holdings, trend and return snapshot.</div></div></div><div class="value-card"><div class="label cyan">Current Value</div><div class="big-value cyan">'+money(cats.stocks.value)+'</div><div class="small-note">'+esc(monthLabel(month))+' return '+pct(cats.stocks.month?.pct)+'</div></div><div class="chart-card trend-wide"><div class="chart-title">Stocks • monthly trend</div>'+sSvg+'</div><div class="returns4"><div class="return-cell"><div class="label">Daily</div><div class="rval '+signClass(g.totals?.stocks?.day?.pct)+'">'+pct(g.totals?.stocks?.day?.pct)+'</div></div><div class="return-cell"><div class="label">Weekly</div><div class="rval '+signClass(g.totals?.stocks?.week?.pct)+'">'+pct(g.totals?.stocks?.week?.pct)+'</div></div><div class="return-cell"><div class="label">Monthly</div><div class="rval '+signClass(g.totals?.stocks?.month?.pct)+'">'+pct(g.totals?.stocks?.month?.pct)+'</div></div><div class="return-cell"><div class="label">Yearly</div><div class="rval '+signClass(g.totals?.stocks?.year?.pct)+'">'+pct(g.totals?.stocks?.year?.pct)+'</div></div></div>'+stockRows+'</div>'+footer(3)+'</section>';

 const mfTrend=data.categoryTrends?.mutualfunds||[],utilTrend=data.categoryTrends?.utility||[];const mfSvg=svgChart(mfTrend,{labels:labelsFor(mfTrend.length?mfTrend:allTrend),color:'#6d75c9'});const uSvg=svgChart(utilTrend,{labels:labelsFor(utilTrend.length?utilTrend:allTrend),color:'#d8aa36'});

async function start(){
 try{
  let incoming=null;try{incoming=JSON.parse(sessionStorage.getItem('ambikashelf_report_data')||'null')}catch(e){}
  if(incoming){await hydrateReport(incoming);return}
  const email=qs.get('email')||getCookie('as_user_email')||local('userEmail');
  if(!email){document.getElementById('app').innerHTML='<section class="report-page"><div class="error-box"><b>Report data unavailable.</b><br>Please open this report through pdfgenerator.html or sign in to AmbikaShelf first.</div></section>';return}
  const month=qs.get('month')||new Date().toISOString().slice(0,7);const nowMonth=new Date().toISOString().slice(0,7);if(month!==nowMonth)throw new Error('Historical reports require a saved report JSON snapshot. The existing portfolio backend exposes current holdings/gains, not calendar-month snapshots.');const d=await fetchData(email);d.email=email;d.month=month;d.reportDate=new Date();d.profile={name:local('userName')||'',email};
  currentData=d;d.trend=await buildTrend(d.portfolio,d.live,'1M',d.gains);d.categoryTrends={};for(const cat of ['stocks','crypto','mutualfunds','utility']){const sub={stocks:d.portfolio.stocks,crypto:d.portfolio.crypto,mutualfunds:d.portfolio.mutualfunds,utility:d.portfolio.utility}[cat];if(sub&&sub.length){d.categoryTrends[cat]=await buildTrend({[cat]:sub},d.live,'1M',d.gains)}}render(d);
 }catch(e){console.error(e);document.getElementById('app').innerHTML='<section class="report-page"><div class="error-box"><b>Could not load the report.</b><br>'+esc(e.message)+'</div></section>'}
}
async function hydrateReport(data){
  window.__AMBICASHELF_CHARTS_READY=false;
  try{
    currentData=data;
    if(!data.trend || !data.categoryTrends){
      data.trend=await buildTrend(data.portfolio,data.live,'1M',data.gains);
      data.categoryTrends={};
      for(const cat of ['stocks','crypto','mutualfunds','utility']){
        const sub=data.portfolio?.[cat]||[];
        if(sub.length) data.categoryTrends[cat]=await buildTrend({[cat]:sub},data.live,'1M',data.gains);
      }
    }
  }catch(err){console.warn('Historical chart hydration failed:',err);data.trend=data.trend||[];data.categoryTrends=data.categoryTrends||{};}
  render(data);
  try{sessionStorage.setItem('ambikashelf_report_data',JSON.stringify(data))}catch(err){}
  window.__AMBICASHELF_CHARTS_READY=true;
  window.parent.postMessage({type:'AMBICASHELF_REPORT_READY',chartsReady:true},'*');
}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='AMBICASHELF_REPORT_DATA'){hydrateReport(e.data.payload)}});
window.AmbikaShelfReport={render,renderFromData:render,getData:()=>currentData};
start();
})();
